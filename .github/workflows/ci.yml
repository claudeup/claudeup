name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on example scripts
        run: |
          shellcheck -x -S warning examples/*/*.sh examples/lib/*.sh examples/lib/stub-bin/claude

      - name: Check example fixture JSON
        run: |
          # A path with & guards write_fixture against bash 5.2 patsub_replacement
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/a&b/.claude"
          mkdir -p "$CLAUDE_CONFIG_DIR/plugins"
          bash -c 'source examples/lib/common.sh && seed_fixture_data'
          for f in installed_plugins.json known_marketplaces.json; do
            path="$CLAUDE_CONFIG_DIR/plugins/$f"
            jq empty "$path"
            if grep -q '@CLAUDE_CONFIG_DIR@' "$path"; then
              echo "::error::$f still contains @CLAUDE_CONFIG_DIR@"
              exit 1
            fi
          done
          jq -e --arg dir "$CLAUDE_CONFIG_DIR" \
            '[.plugins[][] | .installPath | startswith($dir)] | all' \
            "$CLAUDE_CONFIG_DIR/plugins/installed_plugins.json"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: shellcheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Ginkgo CLI
        run: go install github.com/onsi/ginkgo/v2/ginkgo@latest

      - name: Install gum (for wizard tests)
        run: go install github.com/charmbracelet/gum@latest

      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./internal/...

      - name: Run integration tests (Ginkgo)
        run: ginkgo -v --race ./test/integration/...

      - name: Install Claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.claude/local/bin" >> $GITHUB_PATH

      - name: Run acceptance tests (Ginkgo)
        run: ginkgo -v ./test/acceptance/...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          flags: unittests
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: |
          go build -v -o bin/claudeup ./cmd/claudeup
          ./bin/claudeup --version || echo "Version command not implemented yet"

      - name: Test binary runs
        run: |
          ./bin/claudeup --help
